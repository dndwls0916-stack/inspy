<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI 회의실</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="layout">
    <aside class="side">
      <h1 id="title">AI 회의실</h1>
      <p class="sub" id="subtitle">GPT · Gemini · Claude가 함께 토론하고 결론을 정리합니다.</p>

      <div id="demo" class="notice" hidden>데모 모드입니다. 실제 AI는 호출되지 않습니다.</div>

      <label class="theme-toggle"><input type="checkbox" id="sg"> <span>삼국지 모드 <small>유비 · 관우 · 장비</small></span></label>

      <h2>실행 방식</h2>
      <div class="seg" id="mode" role="radiogroup" aria-label="실행 방식">
        <label><input type="radio" name="mode" value="api"><span>API 키</span></label>
        <label><input type="radio" name="mode" value="cli"><span>CLI 로그인</span></label>
        <label><input type="radio" name="mode" value="mixed"><span>혼합</span></label>
      </div>
      <p id="modeHelp" class="hint"></p>

      <h2>참가자</h2>
      <div id="participants"></div>

      <h2>회의 설정</h2>
      <label class="field">토론 라운드
        <select id="rounds">
          <option value="1">1 (각자 의견만)</option>
          <option value="2" selected>2 (의견 + 반박)</option>
          <option value="3">3 (심화 토론)</option>
          <option value="c4">합의까지 (최대 4라운드)</option>
          <option value="c6">합의까지 (최대 6라운드)</option>
        </select>
      </label>
      <p id="roundsHint" class="hint" hidden>서로 같은 결론에 이를 때까지 토론합니다. 라운드마다 사회자가 합의 여부를 판정하며, 합의가 안 되면 남은 쟁점을 다음 라운드에 넘깁니다. <b>AI 호출이 많아 시간과 사용량을 더 씁니다.</b></p>
      <label class="field">결론 정리 담당(사회자)
        <select id="moderator"></select>
      </label>
      <button id="reset" class="ghost" type="button">새 회의 시작</button>
    </aside>

    <main class="main">
      <section id="stage" class="stage" hidden aria-label="군의 자리"></section>
      <div id="feed" class="feed">
        <div class="empty">질문을 입력하면 참가자들이 라운드별로 의견을 나누고,<br>사회자가 최종 결론을 정리해 보여줍니다.</div>
      </div>
      <form id="form" class="composer">
        <div class="attach-bar">
          <button type="button" id="attachBtn" class="attach-btn" title="파일 첨부 (끌어다 놓아도 됩니다)">📎 첨부</button>
          <input type="file" id="fileInput" multiple hidden accept=".txt,.md,.markdown,.csv,.tsv,.json,.jsonl,.xml,.html,.htm,.css,.js,.mjs,.ts,.tsx,.jsx,.py,.java,.c,.cpp,.h,.cs,.go,.rs,.rb,.php,.sh,.bat,.ps1,.sql,.yml,.yaml,.toml,.ini,.cfg,.conf,.log,.srt,.vtt,.tex,.pdf,.docx">
          <span id="attachList" class="chips"></span>
          <span id="attachMsg" class="attach-msg" role="status"></span>
        </div>
        <textarea id="q" rows="2" placeholder="회의에 올릴 질문이나 고민을 입력하세요 (Ctrl/⌘+Enter 전송)"></textarea>
        <button id="send" type="submit">회의 시작</button>
        <button id="stop" type="button" hidden>중단</button>
      </form>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
